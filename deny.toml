# cargo-deny configuration. Run: cargo deny check
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Svalnir is a macOS product; check only the dependency graph that it builds.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[advisories]
# RustSec advisories for vulnerable, unmaintained, unsound, and yanked crates.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# Each license must be compatible with distribution under GPL-3.0-only.
# Keep this list the same as `accepted` in about.toml.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are unpublished; their license is checked like any other.
ignore = false

[bans]
# GPUI's dependency tree has about 30 duplicate versions that Svalnir cannot
# remove. Review `cargo deny check bans --show-stats` after dependency updates.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

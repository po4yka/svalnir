[workspace]
resolver = "3"
members = [
    "crates/svalnir-core",
    "crates/svalnir-agent",
    "crates/svalnir-privileged",
    "crates/svalnir-cli",
    "crates/svalnir-gui",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
repository = "https://github.com/po4yka/svalnir"
publish = false

# Shared version selections. A crate adds `name.workspace = true` only when it
# uses the dependency; Cargo warns about unused dependencies.
[workspace.dependencies]
# Internal crates
svalnir-core = { path = "crates/svalnir-core" }
svalnir-agent = { path = "crates/svalnir-agent" }

# CLI
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"

# GUI. gpui-kit re-exports the GPUI snapshot that it pins (`gpui_kit::gpui`).
# Keep the requirement exact: a GPUI snapshot can change the API.
# The default features are `component` (the styled components) and `assets`
# (the Lucide component icons). gpui-component has no feature that removes its
# Markdown, LSP-type, file-watch, or i18n dependencies, so the GUI graph has
# about 510 crates. The graph for macOS has no HTTP client or TLS crate. The
# release `svalnir-gui` binary, which shows one label, is 16.6 MB (2026-11-16).
gpui-kit = "=0.10.0"

# Serialization and configuration
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

# Content digests of plans and policy revisions. The same version is in the
# GUI graph through gpui-kit.
sha2 = "0.11.1"

# Local state
rusqlite = { version = "0.43.0", features = ["bundled"] }

# Diagnostics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"

# Native integration
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDate", "CFString", "CFURL", "CFUserNotification"] }
objc2-app-kit = "0.3.2"
dispatch2 = "0.3.1"
libc = "0.2.191"

# Tests only: disposable directories for the journal and the executors.
tempfile = "3.27.0"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# GPUI APIs use `Context<Self>` without the `'_` lifetime throughout.
elided_lifetimes_in_paths = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that add noise without a matching project invariant.
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Production control paths handle failure explicitly (AGENTS.md).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
exit = "warn"
mem_forget = "warn"
unused_result_ok = "warn"
let_underscore_must_use = "warn"
# Keep `unsafe` small and documented.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
# Every suppression states its reason and is checked for staleness.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[package]
name = "svalnir-agent"
description = "Svalnir user agent: collection, lifecycle, orchestration, application adapters, and client IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "svalnir_agent"
path = "src/lib.rs"

[[bin]]
name = "svalnir-agent"
path = "src/main.rs"

# A test program with its own `main`: the main run loop runs only on the
# main thread of a process, which the test harness uses for itself.
[[test]]
name = "run_loop_stop"
path = "tests/run_loop_stop.rs"
harness = false

# The dependencies of the Milestone 1 modules, which are also those of the
# declared Milestone 2 modules. No rendering crate is permitted in this graph.
[dependencies]
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
svalnir-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
# `CFUserNotification`: the urgent dialog of the agent (`notify`).
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true

# `test-support`: a build for tests. The account record of the `HOME`
# check can come from `SVALNIR_TEST_ACCOUNT_HOME`, so that a test starts
# the binary with a temporary home directory. A build without the feature,
# and a build with no debug assertions, has no code that reads that
# variable. The feature also gives the rule fixtures (`rules::fixture`) and
# `ReviewedRules::with_fixture_lifecycle`, with which a fixture test runs
# the path of an eviction in a temporary directory; a build without the
# feature, and a build with no debug assertions, has no function that
# changes the lifecycle state of a rule. No default feature enables it.
[features]
test-support = []

# Tests only: disposable directories for the journal, the rules, and the
# executors. The dependency on this package enables `test-support` for each
# test target, so `cargo test` needs no feature option.
[dev-dependencies]
svalnir-agent = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true

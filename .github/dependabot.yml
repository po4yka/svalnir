version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Move gpui-kit by hand, together with its skills; see "Agent skills" in
      # AGENTS.md. `scripts/check.sh pins` fails when the two differ.
      - dependency-name: "gpui-kit"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

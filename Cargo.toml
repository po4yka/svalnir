[workspace]
resolver = "3"
members = [
    "crates/svalnir-core",
    "crates/svalnir-agent",
    "crates/svalnir-privileged",
    "crates/svalnir-cli",
    "crates/svalnir-gui",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
repository = "https://github.com/po4yka/svalnir"
publish = false

# Shared version selections. A crate adds `name.workspace = true` only when it
# uses the dependency; Cargo warns about unused dependencies.
[workspace.dependencies]
# Internal crates
svalnir-core = { path = "crates/svalnir-core" }

# CLI
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"

# GUI
gpui = "0.2.2"

# Serialization and configuration
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

# Local state
rusqlite = { version = "0.43.0", features = ["bundled"] }

# Diagnostics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
miette = "7.6.0"

# Inventory and native integration
sysinfo = "0.40.3"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
dispatch2 = "0.3.1"
libc = "0.2.191"

[workspace.lints.cargo]
# The selections above are pinned ahead of use while the crates are skeletons.
# TODO(npochaev): remove this allowance when each entry has a consuming crate.
unused_workspace_dependencies = "allow"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

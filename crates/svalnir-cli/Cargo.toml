[package]
name = "svalnir-cli"
description = "Svalnir command-line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "svalnir_cli"
path = "src/lib.rs"

[[bin]]
name = "svalnir"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
svalnir-agent.workspace = true
svalnir-core.workspace = true

# The interrupt flag of `scan` and `monitor` installs a `SIGINT` handler,
# and a transient coordinator installs the handlers of `SIGTERM` and
# `SIGHUP`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# A binary test sets the home directory of the account record of the
# client with `SVALNIR_TEST_ACCOUNT_HOME`, which only a build with
# `test-support` reads.
[dev-dependencies]
svalnir-agent = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true

# cargo-about configuration. scripts/package.sh uses it to generate
# THIRD_PARTY_LICENSES.txt for the release artifacts.
# Keep `accepted` the same as the license allow list in deny.toml.

accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
targets = ["aarch64-apple-darwin"]
# Build and dev dependencies are not linked into the shipped binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Svalnir's own crates are covered by LICENSE.
private = { ignore = true }

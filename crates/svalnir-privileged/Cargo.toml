[package]
name = "svalnir-privileged"
description = "Svalnir privileged helper: authenticated, narrowly defined administrative operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "svalnir_privileged"
path = "src/lib.rs"

[[bin]]
name = "svalnir-privileged"
path = "src/main.rs"

# No rendering crate and no agent crate is permitted in this graph: the
# helper does not link the code of its caller.
[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
svalnir-core.workspace = true
thiserror.workspace = true

# The blocks of the XPC event handlers. The XPC, libdispatch, and Security
# calls are declared in `src/transport/xpc/sys.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true

# Tests only: disposable directories for the executor and the service.
[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

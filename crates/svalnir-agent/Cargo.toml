[package]
name = "svalnir-agent"
description = "Svalnir user agent: collection, lifecycle, orchestration, application adapters, and client IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "svalnir_agent"
path = "src/lib.rs"

[[bin]]
name = "svalnir-agent"
path = "src/main.rs"

# The dependencies of the Milestone 1 modules. No rendering crate is permitted
# in this graph.
[dependencies]
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
svalnir-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[lints]
workspace = true

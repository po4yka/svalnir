[package]
name = "svalnir-agent"
description = "Svalnir user agent: collection, lifecycle, orchestration, application adapters, and client IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "svalnir_agent"
path = "src/lib.rs"

[[bin]]
name = "svalnir-agent"
path = "src/main.rs"

# A test program with its own `main`: the main run loop runs only on the
# main thread of a process, which the test harness uses for itself.
[[test]]
name = "run_loop_stop"
path = "tests/run_loop_stop.rs"
harness = false

# The dependencies of the Milestone 1 modules, which are also those of the
# declared Milestone 2 modules. No rendering crate is permitted in this graph.
[dependencies]
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
svalnir-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

# Tests only: disposable directories for the journal, the rules, and the
# executors.
[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
